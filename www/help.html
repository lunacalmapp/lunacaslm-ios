    text-align:left;padding:11px 14px;border-radius:10px;cursor:pointer;color:#8a849e;transition:.15s;white-space:nowrap;}
  .langbar .langmenu button.active{background:#7c5cbf;color:#fff}
  .langbar .langmenu button.inactive:active{background:#f0ecfa}

    q2: '❓ 付款后多久开通?',
    a2: '通过 App Store 付款的,系统会在付款成功后自动立即开通。通过其他渠道付款的,请在 LINE 发送转账截图和登录邮箱后,管理员会在 24 小时内为你开通。',
    q3: '❓ 换手机/重新登录,数据还在吗?',
    a3: '都在。只要用同一个 Google 账号登录,所有数据(经期、症状、记录)会自动同步回来。',
    q4: '❓ 用不同的 Google 账号登录会怎样?',
    a4: '数据是和每个 Google 账号分开绑定的。用别的账号登录会看不到原账号的数据,请始终使用同一个 Google 账号。',
    q5: '❓ 可以退款吗?',
    a5: '有 7 天免费试用,请试用满意后再开通。通过 App Store 购买的,退款需直接联系 Apple 处理(不经过开发者);其他渠道的退款条件详见「使用条款」页面。',
    q6: '❓ 试用多少天?到期后记录还在吗?',
    a6: '免费试用 7 天。试用到期后,已记录的数据全部保留,只是暂时无法继续新增记录,开通会员即可恢复。',
    q7: '❓ 有几个主题可选?',
    a7: 'VIP 会员可解锁全部 7 个主题,试用期内也能体验全部主题。',
    q8: '❓ 怎么给 App 加锁、换桌面图标?',
    a8: '在 我的 → 私密模式 里。应用锁（PIN，可加 Face ID／指纹）免费，设置前需要先登录；桌面图标每个分类的第一个免费，其余为会员专属。',
    q9: '❓ 忘记 PIN、扫脸不成功怎么办?',
    a9: '扫脸（或指纹）每次打开 App 最多可试 5 次，也可以随时改输 PIN。忘记 PIN 时在锁屏点“忘记 PIN”：会退出登录并清除这台手机上的本地数据，已备份到云端的数据用同一个账号重新登录即可找回；访客模式下数据只在本机，重置后无法找回。',
    guideTitle: '使用教程',
    g1: '记录经期:进入「日历」,点击日期标记经期。',
    g2: '查看预测和统计:首页会显示下次经期,点「统计」查看趋势。',
    g3: '更换主题:进入「我的」,找到主题部分,选择喜欢的颜色。',
    g4: '悬浮球 🌙:点击它获取每日鼓励寄语。',

  en: {
  "pageTitle": "Help Center",
  "pageSubtitle": "Luna · Frequently asked questions",
  "faqTitle": "FAQ",
  "q1": "❓ How do I become a VIP member?",
  "a1": "On the Me page, tap the membership card and choose a plan: Weekly, Monthly, or Yearly. Prices are shown in your local currency. Payment goes through Apple's in-app subscription system, directly inside the app.",
  "q2": "❓ How long until my membership is active?",
  "a2": "Your membership activates automatically right after the App Store payment succeeds. If it doesn't, tap \"Restore purchase\" on the membership page, or email us.",
  "q3": "❓ If I change phones or sign in again, will my data still be there?",
  "a3": "Yes. As long as you sign in with the same Google account, all your data (periods, symptoms, logs) syncs back automatically.",
  "q4": "❓ What happens if I sign in with a different Google account?",
  "a4": "Your data is tied to each Google account separately. If you sign in with another account, you won't see the original account's data, so please always use the same Google account.",
  "q5": "❓ Can I get a refund?",
  "a5": "There is a 7-day free trial, so please try the app and subscribe only when you're happy with it. Refunds for App Store purchases are handled directly by Apple (not by the developer). See the Terms of Service page for details.",
  "q6": "❓ How long is the trial? Will my logs stay after it ends?",
  "a6": "The free trial lasts 7 days. After it ends, everything you've logged is kept. You just can't add new logs until you become a member, and membership restores that.",
  "q7": "❓ How many themes can I choose from?",
  "a7": "VIP members can unlock all 7 themes, and you can try every theme during the trial too.",
  "q8": "❓ How do I lock the app or change the home-screen icon?",
  "a8": "Go to Me → Private mode. The app lock (PIN, plus Face ID / fingerprint) is free, but you need to sign in before setting it up. For home-screen icons, the first icon in each category is free and the rest are for members.",
  "q9": "❓ What if I forget my PIN or the face scan fails?",
  "a9": "You can try the face scan (or fingerprint) up to 5 times each time you open the app, and you can switch to your PIN at any time. If you forget your PIN, tap \"Forgot PIN\" on the lock screen: it signs you out and clears the local data on this phone, and data backed up to the cloud comes back when you sign in again with the same account (guest data cannot be recovered).",
  "guideTitle": "How to use the app",
  "g1": "Log a period: open Calendar and tap a date to mark your period.",
  "g2": "See predictions and stats: the home screen shows your next period. Tap Stats to see trends.",
  "g3": "Change theme: go to Me, find the theme section, and pick the color you like.",
  "g4": "Floating moon 🌙: tap it for a daily message of encouragement.",
  "contactTitle": "Still have questions?",
  "contactBody": "If you can't find an answer, or run into a problem, email us at lunacalm00@gmail.com and we'll get back to you as soon as we can.",
  "lineBtnTxt": "Email us",
  "healthRefTitle": "Health information sources",
  "healthRefBody": "<strong>Luna Calm is not a medical device.</strong> The health content in the app (Luna assistant replies, AI in-depth analysis, and period/ovulation predictions) is for reference only and is not a substitute for professional medical advice, diagnosis, or contraception.<br><br>This content is compiled from public information published by the following organizations:<ul style=\"margin:8px 0 0 18px;padding:0;\"><li style=\"margin-bottom:4px;\"><a href=\"https://www.who.int/news-room/fact-sheets/detail/menstrual-health\" target=\"_blank\" rel=\"noopener\" style=\"color:#7c5cbf;\">World Health Organization (WHO)</a></li><li style=\"margin-bottom:4px;\"><a href=\"https://www.mayoclinic.org/healthy-lifestyle/womens-health/in-depth/menstrual-cycle/art-20047186\" target=\"_blank\" rel=\"noopener\" style=\"color:#7c5cbf;\">Mayo Clinic – Menstrual cycle</a></li><li style=\"margin-bottom:4px;\"><a href=\"https://www.mayoclinic.org/diseases-conditions/iron-deficiency-anemia/symptoms-causes/syc-20355034\" target=\"_blank\" rel=\"noopener\" style=\"color:#7c5cbf;\">Mayo Clinic – Iron deficiency anemia</a></li><li style=\"margin-bottom:4px;\"><a href=\"https://www.cdc.gov/uti/about/index.html\" target=\"_blank\" rel=\"noopener\" style=\"color:#7c5cbf;\">CDC – Urinary Tract Infection</a></li><li><a href=\"https://www.cdc.gov/hpv/index.html\" target=\"_blank\" rel=\"noopener\" style=\"color:#7c5cbf;\">CDC – HPV and HPV Vaccine</a></li></ul><br>If you have unusual symptoms or health concerns, please talk to a doctor directly",
  "backBtn": "← Back"

function toggleLangMenu(force) {
  const bar = document.getElementById('langBar');
  if(!bar) return;
  const open = typeof force === 'boolean' ? force : !bar.classList.contains('open');
  bar.classList.toggle('open', open);
}

  const bar = document.getElementById('langBar');
  if(bar && bar.classList.contains('open') && !bar.contains(e.target)) toggleLangMenu(false);
});

  }
  function pick(c){ if(c==='tw'&&!has('tw')) c='zh'; return has(c)?c:null; }
  var TT={zh:'语言',tw:'語言',th:'ภาษา',en:'Language',vi:'Ngôn ngữ',id:'Bahasa',fil:'Wika',ja:'言語',ko:'언어',es:'Idioma',pt:'Idioma',tr:'Dil',fr:'Langue',ms:'Bahasa',hi:'भाषा',ar:'اللغة',ur:'زبان',bn:'ভাষা',he:'שפה',uk:'Мова',ta:'மொழி'};
  function label(){ var el=document.getElementById('langCurrent'); if(el) el.textContent=NAME[cur]||cur;
    var t=document.getElementById('lpTitle'); if(t) t.textContent=TT[cur]||TT.en;
    [].forEach.call(document.querySelectorAll('#lpGrid .lpr'),function(b){ b.classList.toggle('on',b.getAttribute('data-l')===cur); }); }
  window.setLang=function(l){ var c=pick(l)||'en'; cur=c; orig(c); label(); };
  function build(){
    var h=''; OPT.forEach(function(x){ h+='<button type="button" class="lpr" data-l="'+x[0]+'" onclick="lpChoose(\''+x[0]+'\')"><span class="lpf">'+x[1]+'</span><span class="lpn">'+x[2]+'</span><span class="lpk">✓</span></button>'; });
    document.getElementById('lpGrid').innerHTML=h;
  }
  window.openLangPage=function(){ var o=document.getElementById('lpOv'); label(); void o.offsetWidth; o.classList.add('on'); document.documentElement.style.overflow='hidden'; o.scrollTop=0;
    var s=o.querySelector('.lpr.on'); if(s){ try{ var d=s.getBoundingClientRect().top-o.getBoundingClientRect().top; o.scrollTop=Math.max(0,d-(o.clientHeight-s.offsetHeight)/2); }catch(e){} } };
  window.closeLangPage=function(){ document.getElementById('lpOv').classList.remove('on'); document.documentElement.style.overflow=''; };
  window.lpChoose=function(l){ if(l===cur){ window.closeLangPage(); return; } window.setLang(l);
    try{ var u=new URL(location.href); u.searchParams.set('lang',l); history.replaceState(null,'',u.toString()); }catch(e){}
    window.closeLangPage(); window.scrollTo(0,0); };
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') window.closeLangPage(); });
  build();
  // ── 选语言的优先级：网址 ?lang= > 已保存的选择（含 App 内同步过来的）> 手机系统语言 > English ──
  var q=null; try{ q=new URLSearchParams(location.search).get('lang'); }catch(e){}
  var stored=!!window.__lunaHadStore;
  var start=null;
  if(q && q!=='zh') start=pick(norm(q));
  if(start){ window.setLang(start); }
  else if(q==='zh' || stored){ /* 沿用页面原有逻辑(App 内打开 / 之前选过) */ cur=(function(){ var d=document.documentElement.lang||'th'; if(d==='zh-CN') return 'zh'; return pick(norm(d))||'th'; })(); label(); }
  else {
    var list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||'en'], auto='en';
    for(var i=0;i<list.length;i++){ var c=pick(norm(list[i])); if(c){ auto=c; break; } }
    window.setLang(auto);
    // 自动判断的结果不当作"用户选择"保存，手机换语言后下次仍会跟着变
    try{ if(LS){ var ks=[]; for(var k=0;k<LS.length;k++){ var n=LS.key(k); if(n==='luna_lang'||/^luna_ui_/.test(n)) ks.push(n); } ks.forEach(function(n){ LS.removeItem(n); }); } }catch(e){}
  }
})();
</script>
</body>
</html>
