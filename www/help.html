<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Noto Sans Thai', 'Segoe UI', sans-serif;
    background: #f4f2f9;
    color: #2d2640;
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #7c5cbf, #b49de0);
    padding: 48px 20px 28px;
    text-align: center;
    color: #fff;
    position: relative;
  }
  .header .icon { font-size: 40px; margin-bottom: 10px; }
  .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .header .sub { font-size: 13px; opacity: 0.85; }
  .lang-switch { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
  .lang-btn {
    padding: 6px 18px; border-radius: 20px; border: none; font-size: 13px;
    cursor: pointer; font-family: inherit; font-weight: 600; transition: all .2s;
  }
  .lang-btn.active { background: #fff; color: #7c5cbf; }
  .lang-btn.inactive { background: rgba(255,255,255,0.2); color: #fff; border: 1.5px solid rgba(255,255,255,0.4); }

  /* ── 语言切换：单按钮+下拉菜单（样式对齐官网 luna.html）── */
  .langbar{position:relative;display:inline-flex}
  .langbar .langbtn{display:flex;align-items:center;gap:6px;border:none;font-family:inherit;font-weight:700;
    font-size:13px;padding:8px 14px;border-radius:999px;cursor:pointer;transition:.2s;-webkit-tap-highlight-color:transparent;
    background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.4);color:#fff;}
  .langbar .langbtn:active{background:rgba(255,255,255,0.32)}
  .langbar .langbtn svg{flex:none;display:block}
  .langbar .langbtn .chev{transition:transform .25s ease}
  .langbar.open .langbtn .chev{transform:rotate(180deg)}
  .langbar .langmenu{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(-6px);min-width:130px;
    background:#fff;border-radius:16px;box-shadow:0 12px 34px rgba(80,40,120,0.25);
    padding:6px;display:flex;flex-direction:column;gap:2px;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .2s ease,transform .2s ease,visibility .2s;z-index:20;}
  .langbar.open .langmenu{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .langbar .langmenu button{border:none;background:none;font-family:inherit;font-weight:700;font-size:14px;
    text-align:left;padding:11px 14px;border-radius:10px;cursor:pointer;color:#8a849e;transition:.15s;white-space:nowrap;}
  .langbar .langmenu button.active{background:#7c5cbf;color:#fff}
  .langbar .langmenu button.inactive:active{background:#f0ecfa}

  .container { max-width: 600px; margin: 0 auto; padding: 24px 16px 48px; }

  .section {
    background: #fff; border-radius: 18px;
    padding: 20px 18px; margin-bottom: 14px;
    box-shadow: 0 2px 12px rgba(124,92,191,0.07);
  }
  .section-title {
    font-size: 15px; font-weight: 700; color: #7c5cbf;
    margin-bottom: 6px; display: flex; align-items: center; gap: 8px;
  }
  .faq-q {
    font-size: 14px; font-weight: 700; color: #2d2640;
    margin-top: 16px; margin-bottom: 5px;
  }
  .faq-q:first-of-type { margin-top: 8px; }
  .faq-a {
    font-size: 13.5px; color: #4a4060; line-height: 1.85;
  }
  .step {
    display: flex; gap: 10px; padding: 9px 0;
    border-bottom: 1px solid #f0ecfa;
    font-size: 13.5px; color: #4a4060; line-height: 1.7;
  }
  .step:last-child { border-bottom: none; padding-bottom: 0; }
  .step-num {
    color: #7c5cbf; font-weight: 700; flex-shrink: 0;
  }
  .contact-box {
    background: linear-gradient(135deg, #faf6ff, #fff0fa);

  .line-btn {
    display: inline-flex; align-items: center; gap: 8px;

    color: #fff; text-decoration: none; font-weight: 700; font-size: 14px;

  .back-btn {

<script>
// 返回：如果是被 App 内的 iframe 浮层套着打开的，通知外层关闭浮层（不能直接改 location，那样只会在 iframe 内部跳转，外层紫色头部关不掉）；
// 如果是被独立打开的（浏览器直接访问 / 登录页等场景），保持原逻辑跳回 App 首页
function goBack() {
  if (window.self !== window.top) {
    try { window.parent.postMessage('luna-close-legal', '*'); return; } catch(e) {}
  }
  location.href = '/';
}

function toggleLangMenu(force) {
  const bar = document.getElementById('langBar');
  if(!bar) return;
  const open = typeof force === 'boolean' ? force : !bar.classList.contains('open');
  bar.classList.toggle('open', open);
}
document.addEventListener('click', function(e){
  const bar = document.getElementById('langBar');
  if(bar && bar.classList.contains('open') && !bar.contains(e.target)) toggleLangMenu(false);
});

function setLang(lang) {
  const d = CONTENT[lang];
  for (const key in d) {
    const el = document.getElementById(key);
    if (el) el.innerHTML = d[key];
  }
  document.documentElement.lang = lang;
  document.getElementById('btnTh').className = 'lang-btn ' + (lang === 'th' ? 'active' : 'inactive');
  document.getElementById('btnZh').className = 'lang-btn ' + (lang === 'zh' ? 'active' : 'inactive');
  const cur = document.getElementById('langCurrent');
  if(cur) cur.textContent = lang === 'zh' ? '中文' : 'ไทย';
  toggleLangMenu(false);
}

// 默认跟随 URL 参数 ?lang=zh，否则泰语
const urlLang = new URLSearchParams(location.search).get('lang');
setLang(urlLang === 'zh' ? 'zh' : 'th');
