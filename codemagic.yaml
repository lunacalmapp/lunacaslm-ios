workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    integrations:
      app_store_connect: Luna Calm
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.lunacalm.flow.ios
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6796192825
      node: latest
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync web assets into iOS project
        script: npx cap sync ios
      - name: Force iPhone-only device family (avoid iPad screenshot requirement)
        script: |
          set -e
          PBXPROJ="$CM_BUILD_DIR/ios/App/App.xcodeproj/project.pbxproj"

          echo "== 替换前，当前的 TARGETED_DEVICE_FAMILY 设置 =="
          grep -n "TARGETED_DEVICE_FAMILY" "$PBXPROJ" || echo "⚠️ 没找到这个设置，路径可能不对，请检查 PBXPROJ 路径"

          # 用更宽松的正则匹配：不管有没有引号、数字顺序是"1,2"还是"2,1"，都能匹配到
          perl -pi -e 's/TARGETED_DEVICE_FAMILY = "?[0-9,]+"?;/TARGETED_DEVICE_FAMILY = 1;/g' "$PBXPROJ"

          echo "== 替换后，当前的 TARGETED_DEVICE_FAMILY 设置 =="
          grep -n "TARGETED_DEVICE_FAMILY" "$PBXPROJ"

          # 校验：如果还有任何一行包含逗号（说明还支持多个设备），直接让这次构建失败，
          # 这样就不会再出现"构建显示成功、但设置其实没真的改成功"的情况
          if grep "TARGETED_DEVICE_FAMILY" "$PBXPROJ" | grep -q ","; then
            echo "❌ TARGETED_DEVICE_FAMILY 替换失败，构建中止，请检查 project.pbxproj 里的实际写法"
            exit 1
          fi
          echo "✅ 已确认 TARGETED_DEVICE_FAMILY 全部设为 1（仅 iPhone），可以放心继续打包"
      - name: Increment build number
        script: |
          #!/bin/sh
          set -e
          cd "$CM_BUILD_DIR/ios/App"
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID")
          echo "Latest build number on App Store Connect: $LATEST_BUILD_NUMBER"
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      # 🩹 上一次只用 agvtool new-marketing-version 改版本号，构建出来的 IPA 里版本号还是 1.0，
      # 说明 Info.plist 里 CFBundleShortVersionString 大概率是写死的字符串，没有引用
      # "$(MARKETING_VERSION)" 这个 build setting，所以 agvtool 只改了工程设置、没真正生效。
      # 这次直接用 PlistBuddy 把源 Info.plist 文件本身也强制改掉，双重保险；
      # 并且打印修改前后的值，方便下次直接从日志确认到底有没有真的改成功。
      - name: Bump marketing version
        script: |
          #!/bin/sh
          set -e
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-marketing-version 1.0.3

          PLIST="App/Info.plist"
          echo "== 修改前 Info.plist 里的版本号 =="
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" || echo "⚠️ 没找到 CFBundleShortVersionString 这个 key"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.3" "$PLIST"

          echo "== 修改后 Info.plist 里的版本号 =="
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
