function toggleLangMenu(force) {
  const bar = document.getElementById('langBar');
  if(!bar) return;
  const open = typeof force === 'boolean' ? force : !bar.classList.contains('open');
  bar.classList.toggle('open', open);
}
document.addEventListener('click', function(e){
  const bar = document.getElementById('langBar');
  if(bar && bar.classList.contains('open') && !bar.contains(e.target)) toggleLangMenu(false);
});

function setLang(lang) {
  const d = CONTENT[lang];
  for (const key in d) {
    const el = document.getElementById(key);
    if (el) el.innerHTML = d[key];
  }
  document.documentElement.lang = lang==='zh' ? 'zh-CN' : lang;
  document.getElementById('btnTh').className = 'lang-btn ' + (lang === 'th' ? 'active' : 'inactive');
  document.getElementById('btnZh').className = 'lang-btn ' + (lang === 'zh' ? 'active' : 'inactive');
  const be = document.getElementById('btnEn'); if(be) be.className = 'lang-btn ' + (lang === 'en' ? 'active' : 'inactive');
  const cur = document.getElementById('langCurrent');
  if(cur) cur.textContent = lang === 'zh' ? '中文' : (lang === 'en' ? 'English' : 'ไทย');
  const lb = document.querySelector('.line-btn');
  if(lb){ if(!lb.dataset.h) lb.dataset.h = lb.getAttribute('href'); lb.setAttribute('href', lang==='en' ? 'mailto:lunacalm00@gmail.com' : lb.dataset.h); if(lang==='en') lb.removeAttribute('target'); else lb.setAttribute('target','_blank'); }
  try{
    if(lang==='en'){ localStorage.setItem('luna_ui_en','1'); }
    else if(lang==='zh' || lang==='th'){ localStorage.removeItem('luna_ui_en'); }
  }catch(e){}
  toggleLangMenu(false);
}

// 默认跟随 URL 参数 ?lang=zh；英文模式（luna_ui_en=1）下显示英文，否则泰语
const urlLang = new URLSearchParams(location.search).get('lang');

try{ if(urlLang === 'zh' && localStorage.getItem('luna_ui_en') === '1') _l0 = 'en'; }catch(e){}
setLang(_l0);
