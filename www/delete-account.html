  window.setLang=function(l){ var c=pick(l)||'en'; cur=c; orig(c); label(); };
  function build(){
    var h=''; OPT.forEach(function(x){ h+='<button type="button" class="lpr" data-l="'+x[0]+'" onclick="lpChoose(\''+x[0]+'\')"><span class="lpf">'+x[1]+'</span><span class="lpn">'+x[2]+'</span><span class="lpk">✓</span></button>'; });
    document.getElementById('lpGrid').innerHTML=h;
  }
  window.openLangPage=function(){ var o=document.getElementById('lpOv'); label(); void o.offsetWidth; o.classList.add('on'); document.documentElement.style.overflow='hidden'; o.scrollTop=0;
    var s=o.querySelector('.lpr.on'); if(s){ try{ var d=s.getBoundingClientRect().top-o.getBoundingClientRect().top; o.scrollTop=Math.max(0,d-(o.clientHeight-s.offsetHeight)/2); }catch(e){} } };
  window.closeLangPage=function(){ document.getElementById('lpOv').classList.remove('on'); document.documentElement.style.overflow=''; };
  window.lpChoose=function(l){ if(l===cur){ window.closeLangPage(); return; } window.setLang(l);
    try{ var u=new URL(location.href); u.searchParams.set('lang',l); history.replaceState(null,'',u.toString()); }catch(e){}
    window.closeLangPage(); window.scrollTo(0,0); };
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') window.closeLangPage(); });
  build();
  // ── 选语言的优先级：网址 ?lang= > 已保存的选择（含 App 内同步过来的）> 手机系统语言 > English ──
  var q=null; try{ q=new URLSearchParams(location.search).get('lang'); }catch(e){}
  var stored=!!window.__lunaHadStore;
  var start=null;
  if(q && q!=='zh') start=pick(norm(q));
  if(start){ window.setLang(start); }
  else if(q==='zh' || stored){ /* 沿用页面原有逻辑(App 内打开 / 之前选过) */ cur=(function(){ var d=document.documentElement.lang||'th'; if(d==='zh-CN') return 'zh'; return pick(norm(d))||'th'; })(); label(); }
  else {
    var list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||'en'], auto='en';
    for(var i=0;i<list.length;i++){ var c=pick(norm(list[i])); if(c){ auto=c; break; } }
    window.setLang(auto);
    // 自动判断的结果不当作"用户选择"保存，手机换语言后下次仍会跟着变
    try{ if(LS){ var ks=[]; for(var k=0;k<LS.length;k++){ var n=LS.key(k); if(n==='luna_lang'||/^luna_ui_/.test(n)) ks.push(n); } ks.forEach(function(n){ LS.removeItem(n); }); } }catch(e){}
  }
})();
</script>
</body>
</html>
